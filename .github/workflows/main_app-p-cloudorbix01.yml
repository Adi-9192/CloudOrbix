# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-p-cloudorbix01

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Checkout source code and enable Git LFS
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      # Make sure actual LFS binary files are downloaded
      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull

      # Verify important images before building
      - name: Verify Git LFS assets
        run: |
          echo "Checking CloudOrbix image..."
          ls -lh public/CloudOrbix.png

          echo "Checking background images..."
          ls -lh public/bg.png
          ls -lh public/bg.jpg

          echo "Checking other image assets..."
          ls -lh public/OIP.webp

      # Configure Node.js
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # Install dependencies, build frontend, and run tests
      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      # Verify the generated Vite production build
      - name: Verify production build
        run: |
          echo "Checking dist directory..."
          ls -lh dist

          echo "Checking CloudOrbix production image..."
          ls -lh dist/CloudOrbix.png

          echo "Checking production background..."
          ls -lh dist/bg.png

          echo "Checking Vite assets..."
          ls -lh dist/assets

      # Upload application for deployment job
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # Download application generated by build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Login to Azure using existing OIDC credentials
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5F76A63D1DE04950B42CBD4F731D9672 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FCA73B1FAE28466CAAB6BB52B4635623 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D233C062E5E04F19AC1DCD0EF5EFF015 }}

      # Deploy application to Azure App Service
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-p-cloudorbix01'
          slot-name: 'Production'
          package: .
